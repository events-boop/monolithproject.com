name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    # Pinned: ubuntu-latest moved to 26.04, where "playwright install" fails
    # ("Playwright does not support chromium on ubuntu26.04"), so no check ran.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run lhci
